<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFAN AI - Asisten AI Cerdas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js untuk merender format Markdown dari respons AI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        refan: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Sembunyikan scrollbar horizontal pada bar menu */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Kustomisasi Scrollbar yang rapi */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }

        /* Styling Markdown di dalam Gelembung Chat */
        .prose-chat p { margin-bottom: 0.65rem; line-height: 1.6; }
        .prose-chat p:last-child { margin-bottom: 0; }
        .prose-chat ul, .prose-chat ol { margin-left: 1.25rem; margin-bottom: 0.65rem; list-style-type: disc; }
        .prose-chat ol { list-style-type: decimal; }
        .prose-chat li { margin-bottom: 0.25rem; }
        .prose-chat strong { font-weight: 700; color: inherit; }
        .prose-chat pre {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 0.85rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .prose-chat code {
            font-family: monospace;
            background-color: rgba(99, 102, 241, 0.15);
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.875em;
        }
        .prose-chat pre code {
            background-color: transparent;
            padding: 0;
        }
        .prose-chat a {
            color: #6366f1;
            text-decoration: underline;
        }

        /* Animasi titik mengetik */
        @keyframes bounce-dot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .typing-dot {
            animation: bounce-dot 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-[100dvh] flex flex-col overflow-hidden select-none sm:select-auto transition-colors duration-200">

    <!-- Notifikasi Toast Custom (Pengganti alert) -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-[90%] max-w-sm"></div>

    <!-- Header Aplikasi (Tampilan Mobile & Desktop App Bar) -->

        <div class="flex items-center gap-2.5 min-w-0">
            <!-- Logo REFAN AI -->
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 text-white flex-none">

            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">

                        REFAN AI

                        <!-- Dropdown Menu Pilihan Model -->

                                <div class="p-1.5 rounded-lg bg-amber-500/15 text-amber-500 mt-0.5">
                                    <i data-lucide="zap" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1">

                                    </div>
                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Jawaban kilat & super responsif untuk tugas harian.</p>
                                </div>
                            </button>

                            <button onclick="selectModel('pro')" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-start gap-2.5 mt-1">
                                <div class="p-1.5 rounded-lg bg-purple-500/15 text-purple-500 mt-0.5">
                                    <i data-lucide="crown" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold text-slate-800 dark:text-slate-100 flex items-center gap-1">
                                            REFAN Pro
                                            <span class="text-[9px] px-1.5 py-0.2 rounded bg-gradient-to-r from-indigo-500 to-purple-500 text-white">PRO</span>
                                        </span>

                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Penalaran mendalam, coding kompleks & analisis detail.</p>
                                </div>
                            </button>
                        </div>

                </div>

                </p>
            </div>
        </div>

        <!-- Tombol Aksi Header -->
        <div class="flex items-center gap-1 sm:gap-1.5 flex-none">

            <button onclick="toggleCanvas()" id="header-canvas-btn" title="Buka Ruang Kerja Canvas" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-500/10 hover:text-indigo-500 border border-slate-200 dark:border-slate-700 active:scale-95 transition">

            </button>
            <!-- Tombol Chat Baru -->

                <i data-lucide="square-pen" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <!-- Tombol Ganti Tema -->

                <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                Chat Pintar

                                </div>
                                <div>
                                    <div class="text-xs font-bold text-slate-800 dark:text-slate-200">Riset Mendalam (REFAN Pro)</div>

                                </div>
                            </button>
                        </div>
                    </div>

                </div>
            </main>
